# oauth2-proxy — SSI production kimlik katmanı (Microsoft Entra ID)
#
# Bu dosya YALNIZCA sır-olmayan yapılandırmayı içerir. Sırlar (client secret,
# cookie secret) ortam değişkeni olarak verilir — asla bu dosyaya yazılmaz.
# Doğrulanan sürüm: oauth2-proxy v7.15.4 (Ağu 2026), entra-id provider.
#
# Akış: Kullanıcı -> oauth2-proxy (Entra ID OIDC) -> SSI (http://ssi:5021)
# oauth2-proxy kullanıcıyı doğrular ve X-Forwarded-User + X-Forwarded-Groups
# header'larını upstream'e (SSI) geçirir. SSI, grupları SSI_RBAC_GROUP_ROLE_MAP
# ile rollere çevirir ve RBAC enforce eder.

provider = "entra-id"
# Entra grupları ID token içinde döner (App Registration'da groups claim açık olmalı).
# email/profile scope'ları X-Forwarded-User için gereklidir.
scope = "openid email profile"

# SSI'ya kimliği header olarak geçir. SSI, X-Forwarded-User ve X-Forwarded-Groups
# header'larını okuyacak şekilde hazırdır (src/server/identity.js).
pass_user_headers = true
set_xauthrequest = true
prefer_email_to_user = false

# Upstream = SSI API (compose ağı içinde servis adı). oauth2-proxy tüm istekleri
# doğruladıktan sonra buraya proxy'ler.
upstreams = ["http://ssi:5021"]
reverse_proxy = true
http_address = "0.0.0.0:4180"

# Kurumsal Entra kiracısındaki tüm doğrulanmış kullanıcılar geçebilsin; asıl
# yetki kararı (hangi grup neyi yapar) SSI RBAC'ında verilir.
email_domains = ["*"]

# Kullanıcıyı doğrudan Entra'ya yönlendir (aradaki "Sign in with..." butonunu atla).
skip_provider_button = true

# Çerez güvenliği (TLS arkasında zorunlu).
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"

# Sağlık ucu — SSI'ın /health'i RBAC'tan muaf; proxy ping'i de auth istemez.
ping_path = "/ping"

# --- Ortam değişkeniyle verilecek (bu dosyada TUTULMAZ) ---
# OAUTH2_PROXY_OIDC_ISSUER_URL = https://login.microsoftonline.com/<TENANT_ID>/v2.0
# OAUTH2_PROXY_CLIENT_ID       = <ENTRA_APP_CLIENT_ID>
# OAUTH2_PROXY_CLIENT_SECRET   = <ENTRA_APP_CLIENT_SECRET>
# OAUTH2_PROXY_REDIRECT_URL    = https://<SSI_PUBLIC_HOST>/oauth2/callback
# OAUTH2_PROXY_COOKIE_SECRET   = <32 baytlık rastgele değer>
