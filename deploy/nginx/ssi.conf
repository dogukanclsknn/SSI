# SSI — HTTPS (TLS termination) reverse proxy.
#
# nginx :443 (TLS) → upstream http://ssi:5021. Kullanıcılar artık düz 5021 portuna
# değil, https://ssi.example.com üzerinden erişir. Doğrulanan sürüm: nginx 1.30
# (stable, 2026). Bu dosya /etc/nginx/conf.d/default.conf olarak mount edilir
# (varsayılan sunucuyu ezer).

# HTTP → HTTPS yönlendirme (şifre formu asla düz http'de gitmesin).
server {
    listen 80;
    server_name ssi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ssi.example.com;

    # --- Sertifika (infra'nın verdiği DT / wildcard sertifikası) ---
    # fullchain = sunucu sertifikası + ara/CA zinciri; key = özel anahtar (chmod 600).
    ssl_certificate     /etc/nginx/certs/ssi.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/ssi.key;

    # --- Modern TLS (Mozilla intermediate profili) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSI_TLS:10m;
    ssl_session_tickets off;

    # --- Güvenlik başlıkları ---
    # HSTS: yalnızca bu host (includeSubDomains YOK — diğer iç uygulamaları etkilemesin).
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Canonical Trivy raporu / evidence gövdeleri için yeterli yükleme boyutu.
    client_max_body_size 25m;

    location / {
        proxy_pass http://ssi:5021;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # GÜVENLİK (derinlemesine savunma): SSI kimliği YALNIZCA imzalı oturum
        # çerezinden gelir (SSI_TRUST_ACTOR_HEADER=false). Yine de istemcinin kimlik
        # taklidi yapmasını önlemek için bu header'ları upstream'e geçmeden temizle.
        proxy_set_header X-SSI-Actor-Id     "";
        proxy_set_header X-SSI-Actor-Roles  "";
        proxy_set_header X-Forwarded-User   "";
        proxy_set_header X-Forwarded-Groups "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
